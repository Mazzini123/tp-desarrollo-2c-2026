# Corre en cada push y en cada PR: formato, lint y todos los tests. Los tests
# usan un MongoDB real que levanta mongodb-memory-server (un replica set de un
# nodo, como en docker-compose, porque la API usa transacciones): no hace
# falta un servicio de base aparte.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      # Guarda el binario de MongoDB entre corridas para no bajarlo cada vez.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Tests (servicios, HTTP e integracion, contra MongoDB)
        run: npm test
