# Compose para la VM de Oracle Cloud. Se usa con:
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Diferencias con docker-compose.yml (el de desarrollo):
#
# - mongo NO publica puertos. La api le habla por la red interna de compose
#   (host "mongo"), asi que no hace falta exponerlo.
#
#   Para que algo de la VM llegue a internet hacen falta TRES cosas: que el
#   contenedor publique el puerto ("ports"), que el firewall de la VM lo deje
#   pasar y que la Security List de Oracle tenga una regla de entrada para
#   ese puerto. Con mongo falla la primera, asi que el 27017 no es alcanzable
#   desde afuera aunque alguien lo abriera en Oracle por error: no hay nada
#   escuchando (defensa en profundidad). Ojo: los puertos que
#   publica Docker se saltean ufw (Docker escribe sus propias reglas de
#   iptables), asi que el firewall de Ubuntu no protege un puerto publicado.
# - mongo tiene usuario y contraseña, que salen del archivo .env de la raiz
#   (ver .env.prod.example). Si falta alguna, compose se niega a arrancar.
# - Limites de memoria pensados para una VM de 1 GB (+ 2 GB de swap). Hay
#   DOS limites distintos, uno por proceso (ver cada servicio).

services:
  mongo:
    image: mongo:7
    container_name: cav-mongo
    restart: unless-stopped
    # Limite de MONGO: la cache de WiredTiger (su motor de almacenamiento).
    # Por defecto usa ~50% de (RAM - 1 GB), con un minimo de 256 MB. Lo
    # fijamos en 256 MB para que sea explicito. Es solo la cache: el proceso
    # mongod entero usa algo mas (conexiones, indices en construccion...).
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    # Techo del contenedor entero (cgroups de Linux). Si mongod lo supera, el
    # kernel lo mata y restart lo vuelve a levantar. Medir con
    # "docker stats" antes de bajarlo.
    mem_limit: 700m
    environment:
      # Solo tienen efecto la PRIMERA vez, con el volumen vacio: ahi mongo
      # crea el usuario root. Cambiarlos despues no cambia la contraseña.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Falta MONGO_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # ping no requiere autenticacion: solo confirma que mongo ya acepta conexiones.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build: .
    container_name: cav-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      # authSource=admin: el usuario root se crea en la base "admin", no en
      # codigo-a-voluntad, asi que hay que decirle a mongo donde buscarlo.
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/codigo-a-voluntad?authSource=admin
      # Limite de la API (Node), NO de mongo: tope del heap de V8 (los
      # objetos de JavaScript), en MB. El proceso usa mas que eso (codigo,
      # buffers, la pila): con 256 de heap, Node ocupa unos 350-400 MB.
      NODE_OPTIONS: --max-old-space-size=256
      # Opcionales: sin SMTP_URL los emails se simulan (ver .env.prod.example).
      SMTP_URL: ${SMTP_URL:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}

      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      
    # Techo del contenedor de la api (cgroups). Por encima del heap: deja
    # lugar para lo que Node usa fuera de el.
    mem_limit: 512m
    depends_on:
      mongo:
        # Espera a que el healthcheck de mongo de OK, no solo a que el
        # contenedor exista. Si no, la api podria arrancar antes que la base.
        condition: service_healthy

volumes:
  mongo-data:
