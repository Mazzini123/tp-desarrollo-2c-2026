services:
  mongo:
    image: mongo:7
    container_name: cav-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: .
    container_name: cav-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      MONGO_URI: mongodb://mongo:27017/codigo-a-voluntad
    depends_on:
      - mongo

volumes:
  mongo-data: