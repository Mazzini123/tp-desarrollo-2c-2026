services:
  mongo:
    image: mongo:7
    container_name: cav-mongo
    restart: unless-stopped
    ports:
      # 127.0.0.1: solo se puede conectar desde esta misma maquina (Compass,
      # mongosh, los tests de integracion). Este Mongo no tiene usuario ni
      # contraseña: si alguien levantara este compose en un servidor, no queda
      # escuchando para toda la red.
      - "127.0.0.1:27017:27017"
    # Replica set de un solo nodo: no agrega tolerancia a fallas, pero es lo
    # que MongoDB exige para hacer transacciones (altas de colectivo con su
    # lider, cambio de lider, aceptar una solicitud de ingreso).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      # Volumen con nombre: Docker lo guarda en su propia carpeta
      # (/var/lib/docker/volumes/...), no en la del proyecto. Sobrevive a
      # "docker compose down"; "down -v" lo borra.
      - mongo-data:/data/db
    healthcheck:
      # La primera vez inicia el replica set; despues solo confirma que el
      # nodo ya es PRIMARY (recien ahi acepta transacciones).
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); quit(1) }",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: .
    container_name: cav-api
    restart: unless-stopped
    ports:
      # Puerto 8000 de la maquina -> puerto 8000 del contenedor.
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      # "mongo" es el nombre del servicio: dentro de la red interna de
      # compose, cada servicio se encuentra por su nombre.
      MONGO_URI: mongodb://mongo:27017/codigo-a-voluntad?replicaSet=rs0

      # Autenticacion: con LOGTO_* valida los tokens. Sin ellas, este compose
      # de desarrollo corre sin login (AUTH_DESACTIVADA=true por defecto).
      LOGTO_ENDPOINT: ${LOGTO_ENDPOINT:-}
      LOGTO_API_RESOURCE: ${LOGTO_API_RESOURCE:-}
      AUTH_DESACTIVADA: ${AUTH_DESACTIVADA:-true}
      CORS_ORIGENES: ${CORS_ORIGENES:-}

      # Twilio
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
